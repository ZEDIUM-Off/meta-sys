[package]
name = "meta_sys_style"
version = "0.1.0"
description = "Structural readability policy for Meta-System Rust code"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "9fca3bc9fc2bc83c60bde26d18ed68f11564b228" }
dylint_linting = "6.0"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
dylint_testing = "6.0"

[workspace]

[package.metadata.rust-analyzer]
rustc_private = true
